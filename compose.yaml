services:
  valheim-helper:
    build:
      context: .
      dockerfile: Dockerfile
    image: valheim-helper:1.2.0
    container_name: valheim-helper
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "${VALHEIM_HELPER_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
